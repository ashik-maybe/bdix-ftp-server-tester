[project]
name = "bdix-ftp-server-tester"
version = "0.1.0"
description = "Check which BDIX FTP, media and live TV servers actually work. Async Python CLI with HTTP + FTP:21 probes, CSV/JSON output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "bdix",
    "ftp",
    "bangladesh",
    "server-checker",
    "live-tv",
    "httpx",
    "cli",
    "network-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
    "typer>=0.29.1",
]

[project.urls]
Repository = "https://github.com/ashik-maybe/bdix-ftp-server-tester"
Issues = "https://github.com/ashik-maybe/bdix-ftp-server-tester/issues"
"Upstream list" = "https://sites.google.com/view/bdixftpserverlist/"

[project.scripts]
bdix-check = "bdix_check.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.uv.build-backend]
module-name = "bdix_check"
module-root = "src"
